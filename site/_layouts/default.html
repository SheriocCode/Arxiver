<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="assets/img/icon128.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html"><img class="mark" src="assets/img/logo.svg" alt=""><img class="word" src="assets/img/arxiver_black.svg" alt="Arxiver"></a>
    <nav class="site-nav">
      <a href="index.html"{% if page.nav == 'home' %} class="active"{% endif %}>首页</a>
      <a href="guide.html"{% if page.nav == 'guide' %} class="active"{% endif %}>文档</a>
      <a href="reference.html"{% if page.nav == 'reference' %} class="active"{% endif %}>参考</a>
      <a href="changelog.html"{% if page.nav == 'changelog' %} class="active"{% endif %}>更新日志</a>
      <a href="https://github.com/SheriocCode/Arxiver" target="_blank" rel="noopener">GitHub</a>
      <a class="btn primary" href="https://github.com/SheriocCode/Arxiver/releases/latest" target="_blank" rel="noopener">Download</a>
    </nav>
  </div>
</header>

<main>
{{ content }}
</main>

<footer class="site-footer">
  <div class="container">
    <div>©2026 Arxiver · 本机翻译，用你自己的模型</div>
    <div>
      <a href="https://github.com/SheriocCode/Arxiver" target="_blank" rel="noopener">GitHub</a> ·
      <a href="guide.html">文档</a> ·
      <a href="changelog.html">更新日志</a>
    </div>
  </div>
</footer>

<script src="assets/carousel.js" defer></script>

</body>
</html>
